name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,data
          # Exit-zero treats all errors as warnings. 127 char line length.
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.git,__pycache__,data

      - name: Run Test Suite with Pytest
        run: |
          pytest -v

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: patrol-manager-ai:latest
          load: true

      - name: Container Smoke Test (Liveness Check)
        run: |
          docker run -d --name test-app -p 8000:8000 patrol-manager-ai:latest
          sleep 5
          curl --fail http://localhost:8000/healthz || (docker logs test-app && exit 1)
          curl --fail http://localhost:8000/readyz || (docker logs test-app && exit 1)
          docker rm -f test-app
