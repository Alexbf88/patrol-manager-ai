stages:
  - test
  - build
  - k8s-validate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

cache:
  paths:
    - .cache/pip/

lint-and-test:
  stage: test
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,data
    - pytest -v

docker-build-test:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t patrol-manager-ai:test .
    - docker run -d --name test-container -p 8000:8000 patrol-manager-ai:test
    - sleep 5
    - docker run --network host curlimages/curl:latest http://localhost:8000/healthz
    - docker run --network host curlimages/curl:latest http://localhost:8000/readyz
    - docker rm -f test-container

k8s-manifest-validation:
  stage: k8s-validate
  image: alpine/k8s:1.29.2
  script:
    - kubectl apply --dry-run=client -k k8s/
