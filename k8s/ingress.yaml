apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patrol-manager-ai-ingress
  namespace: patrol-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: patrol.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: patrol-manager-ai
                port:
                  number: 80
