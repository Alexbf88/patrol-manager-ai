apiVersion: apps/v1
kind: Deployment
metadata:
  name: patrol-manager-ai
  namespace: patrol-system
  labels:
    app.kubernetes.io/name: patrol-manager-ai
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: patrol-manager-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patrol-manager-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: patrol-manager-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_PATH
              value: "/app/data/rondas.db"
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service.patrol-system.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "llama3.1:latest"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: config-volume
              mountPath: /app/config/contacts.json
              subPath: contacts.json
              readOnly: true
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: patrol-manager-data-pvc
        - name: config-volume
          configMap:
            name: patrol-manager-config
